[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "md-state-space-analysis"
version = "0.1.0a1"
description = "Reproducible feature-space analysis, clustering, PCA, tICA, and latent-state tools for molecular-dynamics trajectories"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Research software author", email = "replace-before-release@example.org"}]
keywords = ["molecular dynamics", "tICA", "PCA", "clustering", "MSM", "computational biophysics"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scipy>=1.10",
  "scikit-learn>=1.3",
  "matplotlib>=3.7",
]

[project.optional-dependencies]
latent = ["torch>=2.0"]
density = ["hdbscan>=0.8.33"]
test = ["pytest>=7.4"]
all = ["torch>=2.0", "hdbscan>=0.8.33", "pytest>=7.4"]

[project.scripts]
mdstate = "mdstate.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"
